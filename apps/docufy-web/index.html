<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Docufy</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/docufy.ico" />
  <link data-trunk rel="rust" data-bin="docufy-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #docufy_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #docufy_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="docufy_canvas"></canvas>
  <div id="docufy_loading">Loading Docufy&hellip;</div>
</body>
</html>
