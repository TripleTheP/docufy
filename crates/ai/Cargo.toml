[package]
name = "docufy-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Docufy AI assistance: providers, settings, hardware checks, warnings and streaming chat clients"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "gpu"] }
keyring = "4.2"
starship-battery = "0.12"
sha2 = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
