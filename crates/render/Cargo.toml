[package]
name = "docufy-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Docufy rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
docufy-geom = { workspace = true, features = ["image"] }
docufy-doc = { workspace = true }
docufy-fonts = { workspace = true }
docufy-layout = { workspace = true }
docufy-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
